<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RITUVAYA — Connecting Possibilities Worldwide</title>

<meta name="description"
content="RITUVAYA connects businesses with manufacturers, suppliers, service providers, business partners and opportunities across India and international markets.">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#ffffff;
    color:#10233f;
    line-height:1.6;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

button{
    font-family:inherit;
}


/* =========================
   VARIABLES
========================= */

:root{
    --blue:#0757b8;
    --dark-blue:#062b57;
    --green:#35b875;
    --light-green:#e9f8f0;
    --light-blue:#eef6ff;
    --text:#10233f;
    --muted:#64748b;
    --white:#ffffff;
}


/* =========================
   HEADER
========================= */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    background:rgba(255,255,255,0.88);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(15,55,100,0.08);
}

.navbar{
    max-width:1200px;
    margin:auto;
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
}

.logo{
    font-size:27px;
    font-weight:800;
    letter-spacing:1px;
    color:var(--blue);
}

.logo span{
    color:var(--green);
}

.nav-links{
    display:flex;
    gap:32px;
    align-items:center;
}

.nav-links a{
    font-size:15px;
    font-weight:600;
    color:#31445d;
    transition:0.3s;
}

.nav-links a:hover{
    color:var(--blue);
}

.nav-btn{
    padding:11px 20px;
    border-radius:30px;
    background:var(--blue);
    color:white !important;
    box-shadow:0 8px 25px rgba(7,87,184,0.22);
}

.nav-btn:hover{
    transform:translateY(-2px);
}


/* =========================
   HERO
========================= */

.hero{
    min-height:100vh;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:120px 24px 80px;
    background:
        radial-gradient(circle at 10% 20%, rgba(53,184,117,0.10), transparent 30%),
        radial-gradient(circle at 90% 30%, rgba(7,87,184,0.12), transparent 35%),
        linear-gradient(135deg,#ffffff,#f5faff);
}

.hero-content{
    max-width:1100px;
    width:100%;
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    align-items:center;
    gap:60px;
    position:relative;
    z-index:2;
}

.hero-text{
    animation:heroText 1s ease forwards;
}

.hero-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 16px;
    background:rgba(53,184,117,0.10);
    border:1px solid rgba(53,184,117,0.22);
    border-radius:30px;
    color:#168451;
    font-size:13px;
    font-weight:700;
    margin-bottom:22px;
    animation:fadeDown 0.9s ease forwards;
}

.hero h1{
    font-size:clamp(55px,8vw,92px);
    line-height:0.95;
    letter-spacing:-4px;
    color:var(--dark-blue);
    margin-bottom:18px;
    animation:heroTitle 1s ease forwards;
}

.hero h1 span{
    color:var(--green);
}

.hero h2{
    font-size:clamp(23px,3vw,38px);
    line-height:1.2;
    color:#31516f;
    margin-bottom:20px;
    animation:fadeUp 1s 0.25s ease both;
}

.hero p{
    max-width:650px;
    font-size:18px;
    color:var(--muted);
    margin-bottom:30px;
    animation:fadeUp 1s 0.4s ease both;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    animation:fadeUp 1s 0.55s ease both;
}

.primary-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:15px 26px;
    border-radius:12px;
    background:var(--blue);
    color:white;
    font-weight:700;
    transition:0.3s;
    box-shadow:0 12px 30px rgba(7,87,184,0.25);
}

.primary-btn:hover{
    transform:translateY(-4px);
    box-shadow:0 18px 35px rgba(7,87,184,0.30);
}

.secondary-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:15px 26px;
    border-radius:12px;
    border:1px solid #d6e2ee;
    background:white;
    color:var(--dark-blue);
    font-weight:700;
    transition:0.3s;
}

.secondary-btn:hover{
    transform:translateY(-4px);
    border-color:#a9c7e5;
}


/* =========================
   HERO VISUAL
========================= */

.hero-visual{
    min-height:480px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    animation:visualIn 1.2s 0.3s ease both;
}

.globe{
    width:310px;
    height:310px;
    border-radius:50%;
    border:2px solid rgba(7,87,184,0.30);
    position:relative;
    box-shadow:
        0 0 0 18px rgba(7,87,184,0.03),
        0 0 70px rgba(7,87,184,0.12);
    animation:glowPulse 4s ease-in-out infinite;
}

.globe::before,
.globe::after{
    content:"";
    position:absolute;
    inset:15px 75px;
    border:1px solid rgba(7,87,184,0.20);
    border-radius:50%;
}

.globe::after{
    inset:75px 15px;
}

.latitude{
    position:absolute;
    left:18px;
    right:18px;
    top:50%;
    height:1px;
    background:rgba(7,87,184,0.20);
}

.orbit{
    position:absolute;
    width:420px;
    height:150px;
    border:2px solid rgba(53,184,117,0.45);
    border-radius:50%;
    transform:rotate(-25deg);
    animation:orbitMove 7s linear infinite;
}

.orbit-dot{
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--green);
    top:4px;
    left:60px;
    box-shadow:0 0 20px rgba(53,184,117,0.6);
}

.globe-center{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
}

.connection{
    position:absolute;
    width:100%;
    height:100%;
}

.connection span{
    position:absolute;
    width:12px;
    height:12px;
    border-radius:50%;
    background:var(--blue);
    box-shadow:0 0 15px rgba(7,87,184,0.5);
}

.connection span:nth-child(1){
    top:18%;
    left:20%;
}

.connection span:nth-child(2){
    top:30%;
    right:15%;
}

.connection span:nth-child(3){
    bottom:22%;
    left:18%;
}

.connection span:nth-child(4){
    bottom:17%;
    right:25%;
}


/* =========================
   FLOATING ORBS
========================= */

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(2px);
    opacity:0.35;
    pointer-events:none;
}

.orb-one{
    width:90px;
    height:90px;
    background:#8ddbb1;
    top:15%;
    left:4%;
    animation:float 7s ease-in-out infinite;
}

.orb-two{
    width:55px;
    height:55px;
    background:#8db9ef;
    right:7%;
    bottom:17%;
    animation:float 6s 1s ease-in-out infinite;
}

.orb-three{
    width:35px;
    height:35px;
    background:#55c8ee;
    left:40%;
    top:12%;
    animation:float 5s 2s ease-in-out infinite;
}


/* =========================
   GENERAL SECTION
========================= */

section{
    padding:100px 24px;
}

.container{
    max-width:1150px;
    margin:auto;
}

.section-heading{
    max-width:720px;
    margin:0 auto 60px;
    text-align:center;
}

.section-label{
    color:var(--green);
    text-transform:uppercase;
    font-size:13px;
    font-weight:800;
    letter-spacing:2px;
    margin-bottom:12px;
}

.section-heading h2{
    font-size:clamp(32px,5vw,52px);
    color:var(--dark-blue);
    line-height:1.1;
    margin-bottom:16px;
}

.section-heading p{
    color:var(--muted);
    font-size:17px;
}


/* =========================
   ABOUT
========================= */

.about{
    background:white;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.about-card{
    padding:45px;
    border-radius:24px;
    background:linear-gradient(145deg,#f7fbff,#ffffff);
    border:1px solid #e2edf6;
    box-shadow:0 20px 60px rgba(30,70,110,0.08);
}

.about-card h3{
    font-size:30px;
    margin-bottom:18px;
    color:var(--dark-blue);
}

.about-card p{
    color:var(--muted);
    font-size:17px;
}

.about-highlight{
    display:grid;
    gap:18px;
}

.highlight{
    display:flex;
    gap:18px;
    align-items:flex-start;
    padding:20px;
    border-radius:18px;
    background:#f8fbff;
    border:1px solid #e4eef7;
    transition:0.3s;
}

.highlight:hover{
    transform:translateX(8px);
    box-shadow:0 12px 30px rgba(30,70,110,0.08);
}

.highlight-icon{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:var(--light-green);
    font-size:23px;
}

.highlight h4{
    color:var(--dark-blue);
    margin-bottom:4px;
}

.highlight p{
    color:var(--muted);
    font-size:14px;
}


/* =========================
   SERVICES
========================= */

.services{
    background:#f7fbff;
}

.service-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.service-card{
    padding:30px;
    background:white;
    border:1px solid #e2edf6;
    border-radius:20px;
    transition:0.35s;
    position:relative;
    overflow:hidden;
}

.service-card::before{
    content:"";
    position:absolute;
    width:100px;
    height:100px;
    border-radius:50%;
    background:rgba(53,184,117,0.07);
    right:-40px;
    top:-40px;
}

.service-card:hover{
    transform:translateY(-8px);
    box-shadow:0 20px 45px rgba(20,70,110,0.10);
    border-color:#cfe0ef;
}

.service-icon{
    width:55px;
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:16px;
    background:var(--light-blue);
    font-size:27px;
    margin-bottom:20px;
}

.service-card h3{
    color:var(--dark-blue);
    margin-bottom:10px;
}

.service-card p{
    color:var(--muted);
    font-size:15px;
}


/* =========================
   WHO WE WORK WITH
========================= */

.work-with{
    background:white;
}

.work-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.work-card{
    padding:28px;
    border:1px solid #e4edf5;
    border-radius:18px;
    transition:0.3s;
    background:white;
}

.work-card:hover{
    transform:translateY(-6px);
    box-shadow:0 15px 35px rgba(30,70,110,0.08);
}

.work-card .number{
    color:var(--green);
    font-size:13px;
    font-weight:800;
    letter-spacing:1px;
}

.work-card h3{
    margin:8px 0;
    color:var(--dark-blue);
}

.work-card p{
    color:var(--muted);
    font-size:14px;
}


/* =========================
   HOW IT WORKS
========================= */

.how{
    background:
        linear-gradient(135deg,#f2f8ff,#f8fffb);
}

.steps{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
    position:relative;
}

.step{
    text-align:center;
    position:relative;
    z-index:2;
}

.step-number{
    width:64px;
    height:64px;
    margin:0 auto 18px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:white;
    border:2px solid #cfe1f1;
    color:var(--blue);
    font-weight:800;
    font-size:18px;
    box-shadow:0 10px 25px rgba(30,70,110,0.08);
}

.step h3{
    color:var(--dark-blue);
    font-size:17px;
    margin-bottom:7px;
}

.step p{
    color:var(--muted);
    font-size:13px;
}


/* =========================
   WHY CHOOSE
========================= */

.why{
    background:white;
}

.why-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.why-card{
    padding:32px 24px;
    text-align:center;
    border-radius:20px;
    background:linear-gradient(160deg,#ffffff,#f7fbff);
    border:1px solid #e2edf6;
    transition:0.35s;
}

.why-card:hover{
    transform:translateY(-8px);
    box-shadow:0 20px 45px rgba(20,70,110,0.10);
}

.why-icon{
    font-size:38px;
    margin-bottom:18px;
}

.why-card h3{
    color:var(--dark-blue);
    font-size:18px;
    margin-bottom:10px;
}

.why-card p{
    color:var(--muted);
    font-size:14px;
}


/* =========================
   MISSION VISION
========================= */

.mission{
    background:#f7fbff;
}

.mv-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.mv-card{
    padding:45px;
    border-radius:25px;
    color:white;
    position:relative;
    overflow:hidden;
    background:linear-gradient(135deg,#0757b8,#062b57);
    box-shadow:0 20px 50px rgba(7,87,184,0.20);
}

.mv-card:nth-child(2){
    background:linear-gradient(135deg,#168451,#0b6040);
}

.mv-card::after{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    border:1px solid rgba(255,255,255,0.15);
    border-radius:50%;
    right:-80px;
    bottom:-100px;
}

.mv-card h3{
    font-size:30px;
    margin-bottom:15px;
}

.mv-card p{
    color:rgba(255,255,255,0.85);
    font-size:16px;
}


/* =========================
   PRINCIPLE
========================= */

.principle{
    padding:80px 24px;
    background:white;
    text-align:center;
}

.principle-box{
    max-width:950px;
    margin:auto;
    padding:45px 30px;
    border-radius:28px;
    background:linear-gradient(135deg,#eff7ff,#effcf5);
    border:1px solid #dcebf5;
}

.principle-box h2{
    color:var(--dark-blue);
    font-size:clamp(28px,4vw,42px);
    margin-bottom:15px;
}

.principle-flow{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
    font-weight:800;
    color:var(--blue);
}

.principle-flow span:nth-child(even){
    color:var(--green);
    font-size:25px;
}


/* =========================
   CTA
========================= */

.cta{
    padding:100px 24px;
    background:
        radial-gradient(circle at 10% 10%,rgba(53,184,117,0.20),transparent 30%),
        linear-gradient(135deg,#062b57,#0757b8);
    color:white;
    text-align:center;
    position:relative;
    overflow:hidden;
}

.cta h2{
    font-size:clamp(34px,5vw,58px);
    margin-bottom:15px;
}

.cta p{
    max-width:650px;
    margin:0 auto 30px;
    color:rgba(255,255,255,0.80);
    font-size:17px;
}

.cta .primary-btn{
    background:white;
    color:var(--blue);
    box-shadow:none;
}


/* =========================
   FOOTER
========================= */

footer{
    background:#041c38;
    color:white;
    padding:55px 24px 25px;
}

.footer-grid{
    max-width:1150px;
    margin:auto;
    display:grid;
    grid-template-columns:1.4fr 1fr 1fr;
    gap:40px;
    padding-bottom:40px;
}

.footer-brand h2{
    font-size:27px;
    margin-bottom:12px;
}

.footer-brand h2 span{
    color:var(--green);
}

.footer-brand p{
    color:#a8b8c9;
    max-width:400px;
    font-size:14px;
}

.footer-col h4{
    margin-bottom:15px;
}

.footer-col a{
    display:block;
    color:#a8b8c9;
    font-size:14px;
    margin-bottom:9px;
    transition:0.3s;
}

.footer-col a:hover{
    color:white;
}

.footer-bottom{
    max-width:1150px;
    margin:auto;
    padding-top:22px;
    border-top:1px solid rgba(255,255,255,0.10);
    display:flex;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
    color:#8fa2b7;
    font-size:13px;
}


/* =========================
   SCROLL REVEAL
========================= */

.reveal{
    opacity:0;
    transform:translateY(40px);
    transition:opacity 0.8s ease, transform 0.8s ease;
}

.reveal-left{
    opacity:0;
    transform:translateX(-45px);
    transition:opacity 0.8s ease, transform 0.8s ease;
}

.reveal-right{
    opacity:0;
    transform:translateX(45px);
    transition:opacity 0.8s ease, transform 0.8s ease;
}

.reveal.active,
.reveal-left.active,
.reveal-right.active{
    opacity:1;
    transform:translate(0);
}


/* =========================
   ANIMATIONS
========================= */

@keyframes heroText{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}

@keyframes fadeDown{
    from{
        opacity:0;
        transform:translateY(-20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes heroTitle{
    from{
        opacity:0;
        transform:translateY(25px) scale(0.96);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes visualIn{
    from{
        opacity:0;
        transform:scale(0.85) rotate(4deg);
    }
    to{
        opacity:1;
        transform:scale(1) rotate(0);
    }
}

@keyframes orbitMove{
    from{
        transform:rotate(-25deg) rotate(0deg);
    }
    to{
        transform:rotate(-25deg) rotate(360deg);
    }
}

@keyframes glowPulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.04);
    }
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-25px);
    }
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .hero-content{
        grid-template-columns:1fr;
        text-align:center;
    }

    .hero p{
        margin-left:auto;
        margin-right:auto;
    }

    .hero-buttons{
        justify-content:center;
    }

    .hero-visual{
        min-height:360px;
    }

    .globe{
        width:250px;
        height:250px;
    }

    .orbit{
        width:340px;
        height:120px;
    }

    .about-grid{
        grid-template-columns:1fr;
    }

    .service-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .work-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .steps{
        grid-template-columns:1fr;
        gap:30px;
    }

    .why-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .mv-grid{
        grid-template-columns:1fr;
    }

    .footer-grid{
        grid-template-columns:1fr 1fr;
    }
}


@media(max-width:650px){

    .navbar{
        height:68px;
        padding:0 16px;
    }

    .logo{
        font-size:22px;
    }

    .nav-links{
        display:none;
    }

    .hero{
        padding-top:110px;
    }

    .hero h1{
        letter-spacing:-3px;
    }

    .hero p{
        font-size:16px;
    }

    .hero-buttons{
        flex-direction:column;
        align-items:stretch;
    }

    .primary-btn,
    .secondary-btn{
        width:100%;
    }

    section{
        padding:75px 18px;
    }

    .service-grid,
    .work-grid,
    .why-grid{
        grid-template-columns:1fr;
    }

    .about-card{
        padding:30px;
    }

    .mv-card{
        padding:32px;
    }

    .footer-grid{
        grid-template-columns:1fr;
    }

    .footer-bottom{
        flex-direction:column;
    }

    .globe{
        width:220px;
        height:220px;
    }

    .orbit{
        width:300px;
        height:105px;
    }
}


/* =========================
   ACCESSIBILITY
========================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none !important;
        transition:none !important;
        scroll-behavior:auto !important;
    }
}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

<nav class="navbar">

<a href="#home" class="logo">
RITU<span>VAYA</span>
</a>
